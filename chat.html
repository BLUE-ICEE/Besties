<main>

<section class="page-title">

<small>FRIENDS</small>

<h1>A room for your people.</h1>

<p>
This version saves messages locally in the browser.
For actual friends on different devices, we'd connect this
page to a real backend later.
</p>

</section>

<div id="chat" class="chat"></div>

<div class="chatrow">

<input
id="message"
placeholder="say something..."
>

<button class="btn" onclick="sendMessage()">
Send
</button>

</div>

</main>

<footer>Nightfall · friends room</footer>

<script src="script.js"></script>

<script>

let messages =
JSON.parse(
  localStorage.getItem("nightfall-chat") || "[]"
);


function renderChat() {

  const chat =
    document.getElementById("chat");

  chat.innerHTML =
    messages.map(message => `

      <div class="bubble ${message.me ? "me" : ""}">
        ${escapeHTML(message.text)}
      </div>

    `).join("");

  chat.scrollTop =
    chat.scrollHeight;
}


function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


function sendMessage() {

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();

  if (!text) return;

  messages.push({
    text,
    me: true
  });

  localStorage.setItem(
    "nightfall-chat",
    JSON.stringify(messages)
  );

  input.value = "";

  renderChat();
}


document
  .getElementById("message")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      sendMessage();
    }

  });


renderChat();

</script>

</body>
