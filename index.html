<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightfall</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="home">

  <div id="scene" class="scene"></div>
  <div class="shade"></div>

  <header class="topbar">
    <a class="brand" href="index.html">nightfall</a>

    <nav>
      <a href="games.html">games</a>
      <a href="videos.html">watch</a>
      <a href="facts.html">facts</a>
      <a href="little.html">little things</a>
      <a href="things.html">things</a>
      <a href="settings.html">settings</a>
    </nav>
  </header>

  <main class="home-main">

    <section class="clock-wrap">
      <div class="eyebrow" id="tzLabel">
        NEW YORK · EASTERN TIME
      </div>

      <div class="clock" id="clock">--:--</div>

      <div class="date" id="date">
        loading...
      </div>
    </section>

    <section class="now-playing">
      <span class="dot"></span>

      <div>
        <strong id="homeLine">a quiet place on the internet</strong>
        <small id="homeHint">stay as long as you want</small>
      </div>
    </section>

    <button class="scene-btn" id="sceneBtn">↻</button>

  </main>

  <script src="script.js"></script>
</body>
</html>
