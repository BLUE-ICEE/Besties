<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Nightfall — Games</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="page">

<div class="page-shell">


<header class="page-header">

<a href="index.html" class="logo">
Nightfall
</a>

<a href="index.html" class="back">
back home
</a>

</header>


<h1 class="page-title">
Games
</h1>

<p class="page-subtitle">
Actual games. No fake “AI game” buttons.
</p>


<div class="section-title">
2048
</div>


<div class="game">

<div class="game-top">

<div class="game-title">
2048
</div>

<div class="game-score">
score:
<span id="score">0</span>
</div>

</div>


<canvas
id="board"
width="600"
height="600">
</canvas>


<div class="game-help">
Use arrow keys. On mobile, swipe.
</div>

<br>

<button
class="button"
onclick="newGame()">

new game

</button>

</div>



<div class="section-title">
Night Drive
</div>


<div class="game">

<div class="game-top">

<div class="game-title">
Night Drive
</div>

<div class="game-score">
distance:
<span id="distance">0</span>
</div>

</div>


<canvas
id="drive"
width="800"
height="450">
</canvas>


<div class="game-help">
Move with ← → or A / D. Avoid the cars.
</div>

<br>

<button
class="button"
onclick="startDrive()">

start drive

</button>

</div>


</div>


<script src="script.js"></script>


<script>

/* =====================
   2048
===================== */

const canvas =
document.getElementById("board");

const ctx =
canvas.getContext("2d");

let board;
let score;


function newGame(){

board =
Array.from(
{length:4},
() => Array(4).fill(0)
);

score = 0;

addTile();
addTile();

draw();

}


function empty(){

const cells=[];

for(let r=0;r<4;r++){

for(let c=0;c<4;c++){

if(board[r][c]===0){

cells.push([r,c]);

}

}

}

return cells;

}


function addTile(){

const cells=empty();

if(!cells.length) return;

const [r,c] =
cells[
Math.floor(
Math.random()*cells.length
)
];

board[r][c] =
Math.random()<.9 ? 2 : 4;

}


function merge(row){

let a =
row.filter(Boolean);

let result=[];

for(let i=0;i<a.length;i++){

if(a[i]===a[i+1]){

result.push(a[i]*2);

score += a[i]*2;

i++;

}else{

result.push(a[i]);

}

}

while(result.length<4)
result.push(0);

return result;

}


function moveLeft(){

let old =
JSON.stringify(board);

board =
board.map(row=>merge(row));

if(JSON.stringify(board)!==old)
addTile();

draw();

}


function moveRight(){

let old =
JSON.stringify(board);

board =
board.map(row=>
merge([...row].reverse())
.reverse()
);

if(JSON.stringify(board)!==old)
addTile();

draw();

}


function moveUp(){

let old =
JSON.stringify(board);

let next =
Array.from(
{length:4},
()=>Array(4).fill(0)
);

for(let c=0;c<4;c++){

let column =
board.map(row=>row[c]);

let merged =
merge(column);

for(let r=0;r<4;r++){

next[r][c]=merged[r];

}

}

board=next;

if(JSON.stringify(board)!==old)
addTile();

draw();

}


function moveDown(){

let old =
JSON.stringify(board);

let next =
Array.from(
{length:4},
()=>Array(4).fill(0)
);

for(let c=0;c<4;c++){

let column =
board.map(row=>row[c]);

let merged =
merge(column.reverse())
.reverse();

for(let r=0;r<4;r++){

next[r][c]=merged[r];

}

}

board=next;

if(JSON.stringify(board)!==old)
addTile();

draw();

}


function draw(){

ctx.clearRect(
0,
0,
600,
600
);

ctx.fillStyle="#101619";

ctx.fillRect(
0,
0,
600,
600
);

const size=150;

for(let r=0;r<4;r++){

for(let c=0;c<4;c++){

let value=board[r][c];

ctx.fillStyle =
value
? "rgba(230,238,235,.15)"
: "rgba(255,255,255,.045)";

ctx.fillRect(
c*size+7,
r*size+7,
size-14,
size-14
);

if(value){

ctx.fillStyle="#edf2ef";

ctx.font =
value>999
? "32px sans-serif"
: "44px sans-serif";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
value,
c*size+size/2,
r*size+size/2
);

}

}

}

document.getElementById("score")
.textContent=score;

}


window.addEventListener(
"keydown",
event=>{

if(event.key==="ArrowLeft")
moveLeft();

if(event.key==="ArrowRight")
moveRight();

if(event.key==="ArrowUp")
moveUp();

if(event.key==="ArrowDown")
moveDown();

}
);


/* =====================
   NIGHT DRIVE
===================== */

const drive =
document.getElementById("drive");

const dctx =
drive.getContext("2d");

let driving=false;

let carX=380;

let cars=[];

let distance=0;

let lastTime=0;

let keys={};


function startDrive(){

driving=true;

carX=380;

cars=[];

distance=0;

lastTime=
performance.now();

requestAnimationFrame(
driveLoop
);

}


function driveLoop(time){

if(!driving) return;

const delta =
Math.min(
.04,
(time-lastTime)/1000
);

lastTime=time;

distance +=
delta*10;

document.getElementById(
"distance"
).textContent=
Math.floor(distance);


if(keys["ArrowLeft"]||keys["a"]){

carX -=
260*delta;

}

if(keys["ArrowRight"]||keys["d"]){

carX +=
260*delta;

}

carX =
Math.max(
175,
Math.min(
585,
carX
)
);


if(Math.random()<.025){

cars.push({

x:
190+
Math.random()*390,

y:-70,

speed:
170+
distance*2

});

}


cars.forEach(car=>{
car.y += car.speed*delta;
});


cars =
cars.filter(
car=>car.y<500
);


for(const car of cars){

if(

carX < car.x+42 &&
carX+40 > car.x &&
410 < car.y+65 &&
472 > car.y

){

driving=false;

drawDrive();

return;

}

}


drawDrive();

requestAnimationFrame(
driveLoop
);

}


function drawDrive(){

dctx.clearRect(
0,
0,
800,
450
);


dctx.fillStyle="#080d0f";

dctx.fillRect(
0,
0,
800,
450
);


/* road */

dctx.fillStyle="#182126";

dctx.fillRect(
150,
0,
500,
450
);


/* lane */

dctx.strokeStyle=
"rgba(255,255,255,.18)";

dctx.lineWidth=3;

dctx.setLineDash([
24,
25
]);

dctx.beginPath();

dctx.moveTo(
400,
0
);

dctx.lineTo(
400,
450
);

dctx.stroke();

dctx.setLineDash([]);


/* player */

dctx.fillStyle="#dfe8e3";

dctx.fillRect(
carX,
410,
40,
62
);


/* traffic */

cars.forEach(car=>{

dctx.fillStyle="#647276";

dctx.fillRect(
car.x,
car.y,
42,
65
);

});

}


window.addEventListener(
"keydown",
e=>{
keys[e.key]=true;
}
);


window.addEventListener(
"keyup",
e=>{
keys[e.key]=false;
}
);


newGame();

</script>

</body>
</html>
