<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nebula Arcade</title><link rel="stylesheet" href="style.css"></head><body><div id="stars"></div><div class="aurora"></div>
<header class="topbar"><a class="logo" href="index.html"><span>✦</span> NEBULA NOOK</a><nav><a href="index.html">Home</a><a href="games.html">Arcade</a><a href="chat.html">Chat</a><a href="videos.html">Videos</a><a href="facts.html">Facts</a></nav><button class="icon-btn" onclick="document.body.classList.toggle('light')">☾</button></header>
<main class="portal-wrap"><div class="page-hero"><div><a class="back-link" href="index.html">← return to home base</a><p class="eyebrow">NEBULA ARCADE // SECTOR 07</p><h1>PLAY SOMETHING<br><em>RIDICULOUS.</em></h1><p>These are full-screen-ish arcade experiences instead of tiny homepage widgets. Pick a game and lose track of time.</p></div></div>
<div class="arcade-nav"><button class="active" onclick="showGame('meteor')">☄️ Meteor Storm</button><button onclick="showGame('boss')">👾 Cosmic Boss</button><button onclick="showGame('memory')">🧠 Memory Matrix</button><button onclick="showGame('runner')">🚀 Star Runner</button></div>
<section class="card arcade-stage" id="stage"></section></main>
<footer><div><span class="logo"><span>✦</span> NEBULA NOOK</span><p>Play responsibly. Become legendary irresponsibly.</p></div></footer>
<script>
const stage=document.getElementById('stage');let interval;
function showGame(type){clearInterval(interval);document.querySelectorAll('.arcade-nav button').forEach(b=>b.classList.remove('active'));event?.currentTarget?.classList.add('active');if(type==='meteor')meteor();if(type==='boss')boss();if(type==='memory')memory();if(type==='runner')runner();}
function meteor(){stage.innerHTML='<div class="stage-top"><div><p class="eyebrow">GAME 01</p><h2>Meteor Storm</h2></div><div class="hud">SCORE <b id="score">0</b> · TIME <b id="time">30</b></div></div><div class="game-canvas" id="meteorfield"><div class="center-msg" id="startmsg">Click the button below to launch the storm.</div></div><button class="primary" onclick="launchMeteor()">LAUNCH STORM</button>'}
let score=0,time=30;
function launchMeteor(){score=0;time=30;document.getElementById('score').textContent=0;document.getElementById('time').textContent=30;document.getElementById('startmsg').remove();clearInterval(interval);interval=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){clearInterval(interval);alert('☄️ Storm over! Score: '+score)}},1000);let spawn=setInterval(()=>{if(time<=0){clearInterval(spawn);return}const f=document.getElementById('meteorfield'),m=document.createElement('button');m.className='meteor';m.textContent='✦';m.style.left=Math.random()*92+'%';m.style.top=Math.random()*88+'%';m.onclick=()=>{score+=10;document.getElementById('score').textContent=score;m.remove()};f.appendChild(m);setTimeout(()=>m.remove(),1200)},450);}
function boss(){stage.innerHTML='<div class="stage-top"><div><p class="eyebrow">GAME 02</p><h2>Cosmic Boss</h2></div><div class="hud">BOSS HP <b id="hp">100</b>%</div></div><div class="boss-area"><div class="boss" id="boss">👾</div><div><div class="bossbar"><i id="bar"></i></div><p id="bossmsg">The galaxy boss has appeared. Choose your attack.</p><div class="action-grid"><button onclick="hit(8)">☄️ Meteor</button><button onclick="hit(13)">⚡ Starbolt</button><button onclick="hit(17)">🌀 Wormhole</button><button onclick="hit(25)">🌌 Supernova</button></div></div></div>'}
let hp=100;function hit(n){hp=Math.max(0,hp-n);document.getElementById('hp').textContent=hp;document.getElementById('bar').style.width=hp+'%';document.getElementById('bossmsg').textContent=hp?'Direct hit! The boss looks increasingly concerned.':'🏆 BOSS DEFEATED. The galaxy is safe for approximately five minutes.';if(!hp)document.getElementById('boss').textContent='💫';}
let seq=[],user=[],round=0;function memory(){seq=[];user=[];round=0;stage.innerHTML='<div class="stage-top"><div><p class="eyebrow">GAME 03</p><h2>Memory Matrix</h2></div><div class="hud">ROUND <b id="round">0</b></div></div><div class="game-canvas" id="matrix" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:40px"></div><button class="primary" onclick="memoryStart()">START MATRIX</button>'}
function memoryStart(){const m=document.getElementById('matrix');m.innerHTML='';for(let i=0;i<16;i++){const b=document.createElement('button');b.className='memory-cell';b.style.width='100%';b.style.height='100%';b.onclick=()=>memoryTap(i);m.appendChild(b)}seq=[];round=0;next();}
async function next(){user=[];round++;document.getElementById('round').textContent=round;seq.push(Math.floor(Math.random()*16));await new Promise(r=>setTimeout(r,400));for(const i of seq){const b=document.getElementById('matrix').children[i];b.classList.add('on');await new Promise(r=>setTimeout(r,250));b.classList.remove('on');await new Promise(r=>setTimeout(r,100))}}
function memoryTap(i){if(!seq.length)return;user.push(i);if(i!==seq[user.length-1]){alert('Matrix overload! You reached round '+round);seq=[];return}if(user.length===seq.length)next()}
let runnerX=50,runnerScore=0,runnerKeys={};function runner(){stage.innerHTML='<div class="stage-top"><div><p class="eyebrow">GAME 04</p><h2>Star Runner</h2></div><div class="hud">DISTANCE <b id="dist">0</b></div></div><div class="game-canvas" id="runfield"><div class="ship" id="ship">🚀</div><div class="center-msg" id="runmsg">Use ← → or A/D. Dodge the asteroids.</div></div><button class="primary" onclick="startRunner()">START RUN</button>'}
function startRunner(){const f=document.getElementById('runfield'),s=document.getElementById('ship'),msg=document.getElementById('runmsg');msg?.remove();runnerX=50;runnerScore=0;let dead=false;clearInterval(interval);interval=setInterval(()=>{runnerScore++;document.getElementById('dist').textContent=runnerScore;const a=document.createElement('div');a.className='meteor';a.textContent='☄';a.style.left=Math.random()*92+'%';a.style.top='-35px';f.appendChild(a);let y=-35;const fall=setInterval(()=>{y+=5;a.style.top=y+'px';const ar=a.getBoundingClientRect(),sr=s.getBoundingClientRect();if(ar.bottom>sr.top&&ar.left<sr.right&&ar.right>sr.left){dead=true;clearInterval(fall);clearInterval(interval);alert('💥 Ship hit! Distance: '+runnerScore)}if(y>500){clearInterval(fall);a.remove()}},30)},500)}
document.addEventListener('keydown',e=>{if(!document.getElementById('ship'))return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')runnerX=Math.max(5,runnerX-5);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')runnerX=Math.min(95,runnerX+5);const s=document.getElementById('ship');if(s)s.style.left=runnerX+'%'});
meteor();
</script></body></html>
