<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weird Science Archive</title><link rel="stylesheet" href="style.css"></head><body><div id="stars"></div><div class="aurora"></div><header class="topbar"><a class="logo" href="index.html"><span>✦</span> NEBULA NOOK</a><nav><a href="index.html">Home</a><a href="games.html">Arcade</a><a href="chat.html">Chat</a><a href="videos.html">Videos</a><a href="facts.html">Facts</a></nav></header><main class="portal-wrap"><div class="page-hero"><div><a class="back-link" href="index.html">← home</a><p class="eyebrow">WEIRD SCIENCE ARCHIVE</p><h1>THE “NO WAY”<br><em>DEPARTMENT.</em></h1><p>Oddly specific cosmic facts designed to make you stop scrolling and stare at the wall for a second.</p></div></div><div class="fact-wall" id="wall"></div></main><script>
const f=[["01","Venus has a day longer than its year.","One Venus rotation takes about 243 Earth days, while one trip around the Sun takes about 225."],["02","A teaspoon of neutron-star material would be unimaginably heavy.","Neutron stars are among the densest known stellar remnants: roughly Sun-mass material compressed into a city-sized object."],["03","Saturn's density is less than water.","Its average density is about 0.69 g/cm³. The bathtub would need to be approximately planet-sized, though."],["04","A day on Mercury is surprisingly long.","Mercury rotates once every 59 Earth days, but a solar day there lasts about 176 Earth days."],["05","The Moon is leaving Earth by about 3.8 cm each year.","Tidal interactions transfer angular momentum and slowly increase the Moon's average distance."],["06","Olympus Mons is about 22 km high.","Mars' enormous shield volcano rises roughly two and a half times as high as Mount Everest above sea level."],["07","Lightning on Earth can briefly make air extremely hot.","A lightning channel can heat surrounding air to temperatures several times hotter than the Sun's surface."],["08","There are planets with no parent star.","Astronomers have found evidence for free-floating or rogue planets traveling through space without orbiting a star."],["09","Jupiter's Great Red Spot is a storm bigger than Earth.","The exact size changes over time, but the storm has been observed for centuries."],["10","A year on Neptune lasts about 165 Earth years.","Since Neptune takes that long to orbit the Sun, seasons there can last for decades."],["11","The Sun contains almost all the mass in our solar system.","The Sun accounts for about 99.8% of the solar system's total mass."],["12","Some white dwarfs are roughly Earth-sized but extremely massive.","A white dwarf can pack a large fraction of a Sun's mass into an object around Earth's size."],["13","Mars has dust devils that can tower above mountains.","Martian dust devils can become enormous columns because of the planet's atmosphere and surface heating."],["14","The International Space Station sees many sunrises and sunsets.","At roughly a 90-minute orbit, astronauts can experience about 16 sunrises and sunsets in 24 hours."],["15","The observable universe is vastly larger than our solar system.","The observable universe spans tens of billions of light-years across, while our planetary neighborhood is tiny by comparison."],["16","Uranus essentially rolls around the Sun.","Its axial tilt is about 98°, so its rotation is dramatically different from Earth's."],["17","Io is the most volcanically active world known.","Jupiter's huge gravitational influence flexes Io, producing enormous internal heating."],["18","Light from the Sun takes a little over eight minutes to reach Earth.","Even traveling at about 300,000 km/s, sunlight needs roughly 8 minutes 20 seconds to cross the average Earth-Sun distance."],["19","A black hole doesn't automatically suck everything nearby into it.","At a given distance, its gravity behaves according to its mass just like other objects do; crossing the event horizon is the special part."],["20","There are more possible chess games than atoms in the observable universe—under common estimates.","The number of possible chess games is staggeringly large, often estimated around 10^120, compared with roughly 10^80 atoms in the observable universe."]];document.getElementById('wall').innerHTML=f.map(x=>`<article class="card weird-fact"><span class="num">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join("");
</script></body></html>
