<p class="sub">

</p>

<div class="row" style="margin-bottom:20px">
  <button id="randomFact">surprise me</button>
  <button id="allFacts">show everything</button>

];

const container =
  document.getElementById("facts");

function renderFacts(list) {

  container.innerHTML = "";

  list.forEach((fact,index) => {

    const article =
      document.createElement("article");

    article.className="panel fact";

    article.innerHTML=`
      <div class="fact-number">
        FACT ${String(index+1).padStart(3,"0")}
      </div>

      <p>${fact}</p>
    `;

    container.appendChild(article);

  });

}

document
  .getElementById("randomFact")
  .onclick=()=>{

    const fact =
      facts[
        Math.floor(
          Math.random()*facts.length
        )
      ];

    renderFacts([fact]);

    window.scrollTo({
      top:160,
      behavior:"smooth"
    });

  };

document
  .getElementById("allFacts")
  .onclick=()=>renderFacts(facts);

renderFacts(facts);

</script>
